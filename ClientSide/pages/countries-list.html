<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Countries - Countries App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="navbar"></div>

    <div class="page-container">
        <div id="alertBox"></div>

        <h1 class="page-title">Countries</h1>

        <form id="searchForm" class="card">
            <div class="filters-bar">
                <div class="form-row">
                    <label for="nameSearch">Name</label>
                    <input type="text" id="nameSearch" placeholder="e.g. Israel">
                </div>
                <div class="form-row">
                    <label for="regionFilter">Region</label>
                    <select id="regionFilter"><option value="">All regions</option></select>
                </div>
                <div class="form-row">
                    <label for="languageFilter">Language</label>
                    <input type="text" id="languageFilter" placeholder="e.g. English">
                </div>
                <div class="form-row">
                    <label for="currencyFilter">Currency</label>
                    <input type="text" id="currencyFilter" placeholder="e.g. Euro">
                </div>
                <div class="form-row">
                    <label for="sortBy">Sort by</label>
                    <select id="sortBy">
                        <option value="">None</option>
                        <option value="commonName">Name</option>
                        <option value="population">Population</option>
                        <option value="area">Area</option>
                        <option value="region">Region</option>
                    </select>
                </div>
                <div class="form-row">
                    <label for="sortDir">Direction</label>
                    <select id="sortDir">
                        <option value="asc">Ascending</option>
                        <option value="desc">Descending</option>
                    </select>
                </div>
                <div class="form-row" id="myStatusFilterRow" style="display:none;">
                    <label for="myStatusFilter">My status</label>
                    <select id="myStatusFilter">
                        <option value="">All</option>
                        <option value="visited">Visited</option>
                        <option value="wishlist">Wishlist</option>
                        <option value="none">Not on my list</option>
                    </select>
                </div>
            </div>
            <div class="filters-actions" style="margin-top:10px;">
                <button type="submit" class="btn">Search</button>
                <button type="button" id="resetFiltersBtn" class="btn btn-outline">Reset</button>
            </div>
        </form>

        <div id="countriesGrid" class="country-grid"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/countries.js"></script>
</body>
</html>
