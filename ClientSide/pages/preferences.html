<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Preferences - Countries App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="navbar"></div>

    <div class="page-container">
        <div id="alertBox"></div>

        <h1 class="page-title">My Preferences</h1>
        <p class="muted">These preferences personalize your experience (e.g. suggested countries and quizzes).</p>

        <form id="preferencesForm">
            <div class="card">
                <h3>Favorite continents</h3>
                <div id="continentsList"></div>
            </div>

            <div class="card">
                <h3>Favorite countries</h3>
                <div class="form-row">
                    <select id="countriesSelect" multiple size="8"></select>
                    <span class="muted">Ctrl/Cmd + click to select multiple.</span>
                </div>
            </div>

            <div class="card">
                <h3>Languages I speak</h3>
                <div id="languagesList"></div>
                <button type="button" id="addLanguageBtn" class="btn btn-small btn-outline">+ Add language</button>
            </div>

            <button type="submit" class="btn">Save preferences</button>
        </form>
    </div>

    <!-- Row template for a language + proficiency level -->
    <template id="languageRowTemplate">
        <div class="form-row" style="flex-direction:row; align-items:center;">
            <select class="language-name" style="flex:1;"></select>
            <select class="language-level">
                <option value="Beginner">Beginner</option>
                <option value="Intermediate">Intermediate</option>
                <option value="Advanced">Advanced</option>
                <option value="Native">Native</option>
            </select>
            <button type="button" class="btn btn-small btn-danger remove-language-btn">Remove</button>
        </div>
    </template>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/common.js"></script>
    <script>
        const CONTINENTS = ["Africa", "Americas", "Asia", "Europe", "Oceania"];
        // Mirrors Api.js's LANGUAGE_LEVEL_TO_NUMBER, reversed, just for display here.
        const LEVEL_NUMBER_TO_LABEL = { 1: "Beginner", 2: "Intermediate", 3: "Advanced", 4: "Native" };
        // Filled from the real country catalog before any language row is built, so the
        // language picker below is always a dropdown of names that actually exist in the
        // DB - free-text language names could never resolve to a real languageId when
        // saving (see api.js's findLanguagesRaw), so they'd silently be dropped.
        let ALL_LANGUAGES = [];

        $(function () {
            Auth.requireAuth();
            const user = Auth.getCurrentUser();
            const prefs = Auth.getPreferences();

            Api.Countries.getAll().done(function (countries) {
                loadCountries(countries, prefs.countries || []);
                ALL_LANGUAGES = collectUniqueLanguages(countries);

                // "Favorite countries" has no server resource, so it's still read
                // from the locally cached preferences. Continents and languages
                // ARE real server resources (Users/{id}/regions, .../languages),
                // so they're loaded fresh from there instead of trusting any
                // local cache, which could be stale or missing entirely (e.g.
                // first login on a new device/browser).
                $.when(Api.Users.getPreferredRegions(user.id), Api.Users.getUserLanguages(user.id))
                    .done(function (regionsResp, languagesResp) {
                        const regions = regionsResp[0] || [];
                        const languages = languagesResp[0] || [];

                        renderContinents(regions.map(function (r) { return r.regionName; }));

                        if (languages.length) {
                            languages.forEach(function (ul) {
                                addLanguageRow({
                                    name: ul.language.languageName,
                                    level: LEVEL_NUMBER_TO_LABEL[ul.levelLanguage] || "Beginner"
                                });
                            });
                        } else {
                            addLanguageRow();
                        }
                    })
                    .fail(function (err) {
                        renderContinents([]);
                        addLanguageRow();
                        Common.showError(err);
                    });
            }).fail(Common.showError);

            $("#addLanguageBtn").on("click", function () { addLanguageRow(); });
            $("#languagesList").on("click", ".remove-language-btn", function () {
                $(this).closest(".form-row").remove();
            });

            $("#preferencesForm").on("submit", function (e) {
                e.preventDefault();
                savePreferences();
            });
        });

        function renderContinents(selected) {
            const $list = $("#continentsList");
            CONTINENTS.forEach(function (continent) {
                const checked = selected.indexOf(continent) !== -1 ? "checked" : "";
                $list.append(
                    '<label class="checkbox-row" style="display:flex;">' +
                    '<input type="checkbox" class="continent-checkbox" value="' + continent + '" ' + checked + '> ' + continent +
                    '</label>'
                );
            });
        }

        /** Returns the sorted, de-duplicated list of every language name spoken by any country. */
        function collectUniqueLanguages(countries) {
            const seen = {};
            countries.forEach(function (c) {
                (c.languages || []).forEach(function (name) { seen[name] = true; });
            });
            return Object.keys(seen).sort();
        }

        function loadCountries(countries, selectedIds) {
            const $select = $("#countriesSelect");
            countries.forEach(function (c) {
                const selected = selectedIds.indexOf(c.id) !== -1 ? "selected" : "";
                $select.append('<option value="' + c.id + '" ' + selected + '>' + c.commonName + '</option>');
            });
        }

        function addLanguageRow(language) {
            const $row = $($("#languageRowTemplate").html());
            const $nameSelect = $row.find(".language-name");

            $nameSelect.append($("<option>").val("").text("Select a language..."));
            ALL_LANGUAGES.forEach(function (name) {
                $nameSelect.append($("<option>").val(name).text(name));
            });

            if (language) {
                $nameSelect.val(language.name);
                $row.find(".language-level").val(language.level);
            }
            $("#languagesList").append($row);
        }

        function savePreferences() {
            const continents = $(".continent-checkbox:checked").map(function () { return this.value; }).get();
            const countries = $("#countriesSelect").val() ? $("#countriesSelect").val().map(Number) : [];
            const languages = $("#languagesList .form-row").map(function () {
                return {
                    name: $(this).find(".language-name").val().trim(),
                    level: $(this).find(".language-level").val()
                };
            }).get().filter(function (l) { return l.name; });

            Auth.savePreferences({ continents: continents, countries: countries, languages: languages })
                .done(function () { Common.showAlert("Preferences saved.", "success"); })
                .fail(Common.showError);
        }
    </script>
</body>
</html>
