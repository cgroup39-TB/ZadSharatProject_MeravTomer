<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Country Details - Countries App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="navbar"></div>

    <div class="page-container">
        <div id="alertBox"></div>

        <p><a href="countries-list.html">&larr; Back to Countries</a></p>

        <div class="card">
            <div id="countryDetailsView"><p class="muted">Loading...</p></div>

            <div class="card-actions" style="margin-top:16px;">
                <a id="editCountryBtn" class="btn btn-outline" href="#">Edit</a>
                <button id="deleteCountryBtn" class="btn btn-danger">Delete</button>
            </div>
        </div>

        <div id="userListActions" class="card">
            <h3>My Lists</h3>
            <div class="card-actions">
                <button id="addVisitedBtn" class="btn btn-outline">Mark as Visited</button>
                <button id="addWishlistBtn" class="btn btn-outline">Add to Wishlist</button>
            </div>
        </div>

        <div class="card">
            <h3>Shares &amp; Reviews for this country</h3>
            <div id="sharesList"></div>
            <p class="muted" style="margin-top:16px;">
                Reviews can only be written from <a href="my-lists.html">My Lists</a>.
            </p>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/countryDetails.js"></script>
</body>
</html>
