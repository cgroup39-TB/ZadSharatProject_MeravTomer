<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Countries App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="navbar"></div>

    <div class="page-container">
        <div id="alertBox"></div>

        <h1 class="page-title">World Countries Info System</h1>
        <p class="muted">Browse countries, save your visited / wishlist lists, share reviews, and take quizzes.</p>

        <div class="card">
            <h3>Get started</h3>
            <p><a class="btn" href="pages/countries-list.html">Browse Countries</a></p>
            <p><a class="btn btn-outline" href="pages/quiz-list.html">Try a Quiz</a></p>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- App scripts: config/api must load before auth/common, which must load before page scripts -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/common.js"></script>
    <script>
        // Ends the session when this home page is actually closed (tab/browser
        // closed) - but not on a normal in-site navigation, e.g. clicking
        // "Browse Countries". "pagehide" (unlike "beforeunload") sets
        // event.persisted=true when the browser is just caching this page for
        // back/forward navigation instead of discarding it, which is what
        // happens on a same-site link click since nothing here blocks the
        // bfcache - persisted is only false when the page is genuinely gone.
        window.addEventListener("pagehide", function (event) {
            if (!event.persisted && Auth.isLoggedIn()) {
                Auth.logout();
            }
        });
    </script>
</body>
</html>
